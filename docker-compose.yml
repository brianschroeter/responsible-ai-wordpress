version: '3.8'

services:
  wordpress:
    build:
      context: ./docker/wordpress
      dockerfile: Dockerfile
    container_name: mydefenselaw_wordpress
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${TABLE_PREFIX}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('CONCATENATE_SCRIPTS', false);
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content:delegated
      - ./docker/wordpress/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - db
      - mailhog
    networks:
      - mydefenselaw_network

  db:
    image: mariadb:10.11
    container_name: mydefenselaw_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - mydefenselaw_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mydefenselaw_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 64M
    depends_on:
      - db
    networks:
      - mydefenselaw_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mydefenselaw_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - mydefenselaw_network

  wp-cli:
    image: wordpress:cli-php8.2
    container_name: mydefenselaw_wpcli
    user: "33:33"
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content:delegated
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db
      - wordpress
    networks:
      - mydefenselaw_network
    profiles:
      - cli

volumes:
  wordpress_data:
    driver: local
  mariadb_data:
    driver: local

networks:
  mydefenselaw_network:
    driver: bridge
